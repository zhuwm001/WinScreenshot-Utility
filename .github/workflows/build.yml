name: 构建 Windows 安装包

# 什么时候跑：
#   1) 在 Actions 页面手动点「Run workflow」（可填版本号）
#   2) 推送 v 开头的 tag，例如 git push origin v1.0.0 —— 会自动建 Release 并挂上安装包

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.0.0；留空则沿用 installer.iss 里现有的版本"
        required: false
        default: ""
  push:
    tags:
      - "v*"

# 上传 Release 需要写权限
permissions:
  contents: write

# 同样的分支/tag 重复触发时，取消上一次，省时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $v = ("${{ github.ref_name }}" -replace '^[vV]', '').Trim()
          }
          if (-not $v) {
            $m = Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"'
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "本次版本号：$v"

      - name: 把版本号写进安装脚本
        run: python tools/ci_set_version.py ${{ steps.ver.outputs.version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5==5.15.11 Pillow==12.3.0 pyinstaller==6.18.0

      - name: PyInstaller 打包
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: python build_exe.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe，Inno Setup 可能没装上" }
          Write-Host "使用 $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败，退出码 $LASTEXITCODE" }

      - name: 检查产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "installer 目录下没有生成 exe" }
          $exe | ForEach-Object { Write-Host ("{0}    {1:N2} MB" -f $_.Name, ($_.Length / 1MB)) }
          Get-ChildItem dist -Directory | ForEach-Object {
            $mb = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            Write-Host ("dist\{0}    {1:N2} MB" -f $_.Name, $mb)
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/*.exe
          if-no-files-found: error

      - name: 上传免安装版
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/我爱截图/**
          if-no-files-found: error

      - name: 发布 Release（仅推送 tag 时）
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: 我爱截图 v${{ steps.ver.outputs.version }}
          files: installer/*.exe
          generate_release_notes: true
          body: |
            自动构建产物，Windows 10/11 x64。

            - 安装版：下载下方 `我爱截图_安装包_v*.exe`，默认装到 `%LOCALAPPDATA%\Programs\我爱截图`，可选创建桌面快捷方式
            - 免安装版：Actions 页面对应那次构建的 `portable` artifact
