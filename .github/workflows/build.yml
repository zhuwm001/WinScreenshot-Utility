name: 构建 Windows 安装包

# 什么时候跑：
#   1) 推送 v 开头的 tag（如 git push origin v1.1.0）—— 自动建 Release 并挂上安装包
#   2) 在 Actions 页面手动点「Run workflow」，可填版本号，也可选是否同时发 Release
#
# Release 一建好，已经装了旧版本的电脑就会在软件里收到更新提示。
# 前提：仓库必须是公开的（私有仓库的 Release 匿名下载不到）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.1.0；留空则沿用源码里现有的版本"
        required: false
        default: ""
      release:
        description: "同时发布 Release（并设为 Latest）"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          # 生成变更日志要读历史 tag，浅克隆不够
          fetch-depth: 0

      - name: 安装 Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $v = ("${{ github.ref_name }}" -replace '^[vV]', '').Trim()
          }
          if (-not $v) {
            $m = Select-String -Path src\app_config.py -Pattern 'APP_VERSION = "([^"]+)"'
            $v = $m.Matches[0].Groups[1].Value
          }
          if ($v -notmatch '^\d+\.\d+(\.\d+)?$') { throw "版本号格式不对：$v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "本次版本号：$v"

      - name: 把版本号写进安装脚本和源码
        run: python tools/ci_set_version.py ${{ steps.ver.outputs.version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5==5.15.11 Pillow==12.3.0 pyinstaller==6.18.0

      - name: PyInstaller 打包
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: python build_exe.py

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe，Inno Setup 可能没装上" }
          Write-Host "使用 $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败，退出码 $LASTEXITCODE" }

      - name: 打包免安装版
        shell: pwsh
        run: |
          $zip = "dist\我爱截图_免安装版_v${{ steps.ver.outputs.version }}.zip"
          Compress-Archive -Path "dist\我爱截图\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host ("{0}  {1:N2} MB" -f $zip, ((Get-Item $zip).Length / 1MB))

      - name: 检查产物并生成校验值
        id: sums
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installer 目录下没有生成 exe" }
          Write-Host ("{0}    {1:N2} MB" -f $exe.Name, ($exe.Length / 1MB))
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $zip = Get-ChildItem "dist\*.zip" | Select-Object -First 1
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()

          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_sha256=$hash"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_size={0:N1}" -f ($exe.Length / 1MB) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @(
            "$hash  $($exe.Name)"
            "$zipHash  $($zip.Name)"
          ) | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: 生成更新说明
        shell: pwsh
        run: |
          $prev = ""
          try { $prev = (git describe --tags --abbrev=0 HEAD^ 2>$null) } catch { $prev = "" }
          if ($prev) {
            $log = git log "$prev..HEAD" --pretty=format:"- %s" --no-merges
            Write-Host "变更范围：$prev..HEAD"
          } else {
            $log = git log --pretty=format:"- %s" --no-merges -15
            Write-Host "没有上一个 tag，取最近 15 条提交"
          }
          if (-not $log) { $log = "- 细节优化与问题修复" }

          $body = @"
          ### 更新内容

          $log

          ### 下载

          | 版本 | 文件 | 说明 |
          | --- | --- | --- |
          | 安装版（推荐） | `${{ steps.sums.outputs.exe_name }}` | ${{ steps.sums.outputs.exe_size }} MB，静默安装，可在软件内一键更新 |
          | 免安装版 | `我爱截图_免安装版_v${{ steps.ver.outputs.version }}.zip` | 解压即用，不写注册表 |

          ### 校验

          SHA256（安装包）：`${{ steps.sums.outputs.exe_sha256 }}`

          安装包未做代码签名，首次运行如果弹出 SmartScreen 提示，点「更多信息 → 仍要运行」即可。
          "@
          $body | Out-File -FilePath dist\release_body.md -Encoding utf8
          Write-Host $body

      - name: 上传安装包（构建产物）
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/*.exe
          if-no-files-found: error

      - name: 上传免安装版（构建产物）
        uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist/*.zip
          if-no-files-found: error

      - name: 发布 Release
        if: >-
          github.ref_type == 'tag' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 我爱截图 v${{ steps.ver.outputs.version }}
          body_path: dist/release_body.md
          files: |
            installer/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          # 同名 tag 重跑时覆盖旧资产，避免 422
          overwrite_files: true
